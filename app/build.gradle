plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// نسخه خودکار از git (بدون نیاز به تغییر دستی):
//   versionCode = تعداد کل commitها (همیشه بزرگ‌تر می‌شود)
//   versionName = آخرین تگ vX.Y + تعداد commitهای بعد از آن  →  مثلاً 1.5.3
// اگر git در دسترس نباشد (مثلاً از zip بیلد شود) → 1.0.<count> یا 1.0.0
// ---------------------------------------------------------------------------
def git = { List<String> args ->
    try {
        def p = (['git'] + args).execute(null, rootDir)
        def out = p.text.trim()
        p.waitFor()
        return p.exitValue() == 0 && out ? out : null
    } catch (Exception ignored) {
        return null
    }
}
def gitCount = (git(['rev-list', '--count', 'HEAD']) ?: '1') as Integer
def gitVersionName = {
    def d = git(['describe', '--tags', '--long', '--match', 'v[0-9]*', '--exclude', 'v*.*.*'])
    def m = d ? (d =~ /^v(\d+)\.(\d+)(?:\.\d+)?-(\d+)-g/) : null
    return (m != null && m.find()) ? "${m.group(1)}.${m.group(2)}.${m.group(3)}" : "1.0.${gitCount}"
}()

android {
    namespace 'com.hooman.socialblocker'
    compileSdk 36

    defaultConfig {
        applicationId "com.hooman.socialblocker"
        minSdk 26
        targetSdk 36
        versionCode gitCount
        versionName gitVersionName
        // نسخه گوگل‌پلی (با کلید آپلود) امکانات Pro را قفل می‌کند؛ نسخه GitHub همه چیز را رایگان دارد
        // AdMob: شناسه‌های واقعی از GitHub Secrets؛ در غیر این صورت شناسه‌های تستی رسمی گوگل
        def admobApp = System.getenv('ADMOB_APP_ID') ?: 'ca-app-pub-3940256099942544~3347511713'
        def admobRewarded = System.getenv('ADMOB_REWARDED_ID') ?: 'ca-app-pub-3940256099942544/5224354917'
        manifestPlaceholders = [admobAppId: admobApp]
        buildConfigField "String", "ADMOB_REWARDED_ID", "\"${admobRewarded}\""
        buildConfigField "boolean", "PRO_GATED", System.getenv('SB_UPLOAD_KEYSTORE') ? "true" : "false"
    }

    // یک کلید امضای ثابت داخل مخزن، تا APKهای ساخته‌شده روی هر کامپیوتر و روی GitHub
    // روی هم نصب شوند (Update) و تنظیمات پاک نشود.
    // ⚠️ این کلید عمومی است؛ برای انتشار در Play Store کلید خصوصی خودتان را بسازید.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // کلید آپلود گوگل‌پلی: فقط وقتی متغیرهای محیطی (از GitHub Secrets) موجود باشند.
        // Google Play upload key — only when the environment variables (GitHub Secrets) are set.
        if (System.getenv('SB_UPLOAD_KEYSTORE')) {
            upload {
                storeFile file(System.getenv('SB_UPLOAD_KEYSTORE'))
                storePassword System.getenv('SB_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('SB_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('SB_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig System.getenv('SB_UPLOAD_KEYSTORE') ? signingConfigs.upload : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// برای GitHub Actions: ./gradlew -q printVersion
tasks.register('printVersion') {
    doLast { println gitVersionName }
}

dependencies {
    implementation "com.android.billingclient:billing:8.0.0"
    implementation "com.google.android.gms:play-services-ads:24.4.0"
    implementation "com.google.android.ump:user-messaging-platform:3.2.0"
}
