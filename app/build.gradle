plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hooman.socialblocker'
    compileSdk 35

    defaultConfig {
        applicationId "com.hooman.socialblocker"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // برای نصب راحت، نسخه release هم با کلید debug امضا می‌شود
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
