# با هر push به main: APK ساخته می‌شود و با شماره نسخه جدید در Releases منتشر می‌شود.
# On every push to main: build the APK and publish it as a new GitHub Release.
name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags, needed for the version number)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee /tmp/build.log

      # اگر بیلد شکست خورد، لاگ در شاخه ci-log ذخیره می‌شود تا راحت بررسی شود
      # If the build fails, save the log to the ci-log branch for easy debugging
      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "CI"
          git config user.email "ci@users.noreply.github.com"
          cp /tmp/build.log /tmp/keep.log || echo "no log" > /tmp/keep.log
          git checkout --orphan ci-log
          git rm -rf -q --cached . >/dev/null 2>&1 || true
          cp /tmp/keep.log build.log
          git add build.log
          git commit -q -m "Build log for ${GITHUB_SHA}"
          git push -f origin ci-log

      - name: Read version
        id: ver
        run: |
          VERSION=$(./gradlew -q --no-daemon printVersion | tail -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "SocialBlocker-v$VERSION.apk"

      # نسخه گوگل‌پلی (AAB) فقط اگر کلید آپلود در Secrets تعریف شده باشد. راهنما: docs/PLAY_RELEASE.md
      # Google Play bundle (AAB), only when the upload key is stored in repository secrets.
      - name: Build Google Play bundle (AAB)
        id: aab
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          SB_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          SB_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          SB_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No upload key in secrets, skipping AAB"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export SB_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "SocialBlocker-v${{ steps.ver.outputs.version }}-play.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
          echo "file=SocialBlocker-v${{ steps.ver.outputs.version }}-play.aab" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Social Blocker v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            SocialBlocker-v${{ steps.ver.outputs.version }}.apk
            ${{ steps.aab.outputs.file }}
