# با هر push به main: APK ساخته می‌شود و با شماره نسخه جدید در Releases منتشر می‌شود.
# On every push to main: build the APK and publish it as a new GitHub Release.
name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags, needed for the version number)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Read version
        id: ver
        run: |
          VERSION=$(./gradlew -q --no-daemon printVersion | tail -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "SocialBlocker-v$VERSION.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Social Blocker v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: SocialBlocker-v${{ steps.ver.outputs.version }}.apk
